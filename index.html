<style>
/* Layout: a one-hand phone tool - search on top, list in the middle, five tabs at the thumb. Wider screens get a list + detail split. */
:root {
  --bg: #f3f5f6;          /* slate paper with a faint wet-blue bias */
  --surface: #ffffff;
  --ink: #15232b;
  --muted: #5b6b74;
  --line: #d9e0e4;
  --accent: #0f5e78;      /* wet-blue: the colour of chrome-tanned hide */
  --accent-ink: #ffffff;
  --accent-soft: #e2eff4;
  --ok: #1d7a46; --ok-soft: #e3f3e9;
  --warn: #a35f00; --warn-soft: #fbefd9;
  --bad: #b3261e; --bad-soft: #fbe5e3;
  --idle: #6b7780; --idle-soft: #eceff1;
  --f-display: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1519; --surface: #162127; --ink: #e4ecef; --muted: #93a4ad; --line: #26343c;
  --accent: #5fb3d0; --accent-ink: #06222c; --accent-soft: #15323d;
  --ok: #6fcf97; --ok-soft: #12301f; --warn: #f0b252; --warn-soft: #36280f;
  --bad: #f2867c; --bad-soft: #3a1714; --idle: #9aa7af; --idle-soft: #1f2a30; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1519; --surface: #162127; --ink: #e4ecef; --muted: #93a4ad; --line: #26343c;
  --accent: #5fb3d0; --accent-ink: #06222c; --accent-soft: #15323d;
  --ok: #6fcf97; --ok-soft: #12301f; --warn: #f0b252; --warn-soft: #36280f;
  --bad: #f2867c; --bad-soft: #3a1714; --idle: #9aa7af; --idle-soft: #1f2a30; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink);
  padding-block: 10px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; }
.brand .src { font-size: 11px; opacity: .85; text-align: right; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; border: 0; border-radius: 8px; padding: 10px 12px; background: var(--surface); color: var(--ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; border: 1px solid color-mix(in srgb, var(--accent-ink) 45%, transparent); background: transparent; color: var(--accent-ink);
  border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); font-weight: 600; }

main { overflow: hidden; display: grid; grid-template-columns: 1fr; min-height: 0; }
.list { overflow-y: auto; min-height: 0; padding-block: 8px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.count { font-size: 12px; color: var(--muted); margin: 4px 2px 8px; display: flex; justify-content: space-between; gap: 8px; }
.group { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 2px 6px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.row:hover { border-color: var(--accent); }
.swipe { touch-action: pan-y; transition: transform .18s ease, opacity .18s ease; position: relative; }
.swipe.drag { transition: none; }
.swipe.gone { transform: translateX(-110%); opacity: 0; }
.mutebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.mutebar .lnk, .lnk { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; padding: 4px 2px; text-decoration: underline; cursor: pointer; }
.row.muted { opacity: .6; }
.row[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.row .k { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.row .t { font-size: 13px; color: var(--muted); grid-column: 1 / -1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.row .m span b { font-weight: 500; }
.pill { justify-self: end; align-self: start; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--idle-soft); color: var(--idle); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.late { color: var(--bad); font-weight: 600; }
.soon { color: var(--warn); font-weight: 600; }

.detail { display: none; overflow-y: auto; min-height: 0; background: var(--surface); border-left: 1px solid var(--line);
  padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.detail.open { display: block; position: fixed; inset: 0; z-index: 20; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.back { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; }
.dhead h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.sub { color: var(--muted); margin: 0 0 12px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 0 0 16px; }
.kv div { min-width: 0; }
.kv dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
h3 { font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 18px 0 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; }
td.nw { white-space: nowrap; }
tr.void td { color: var(--muted); text-decoration: line-through; }
.link { color: var(--accent); background: none; border: 0; padding: 0; text-align: left; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 24px 4px; text-align: center; }

nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: 0; background: none; padding: 9px 4px 10px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 12px; }
.tab span { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab b { font-family: var(--f-display); font-size: 14px; font-weight: 600; letter-spacing: .02em; }
.tab[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

.loader { display: grid; place-content: center; gap: 12px; text-align: center; padding: 32px max(16px, env(safe-area-inset-left, 0px)); }
.loader .bar { width: 160px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 0 auto; }
.loader .bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .loader .bar i { animation: none; width: 100%; } }
.filepick { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; }
.filepick label { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.filepick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--line); }

.chips:empty { display: none; }
.chip.pick { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); font-weight: 600; }
main.solo { grid-template-columns: 1fr; }
main.solo .detail { display: none; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile b { font-family: var(--f-mono); font-weight: 500; font-size: 24px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); }
.alert { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; }
.alert:hover { border-color: var(--accent); }
.bars { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px; font-size: 13px; }
.bar:hover { background: var(--accent-soft); }
.bar .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .tr { height: 8px; background: var(--idle-soft); border-radius: 4px; overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar .tr i.bad { background: var(--bad); }
.bar .ct { font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 0 0 4px; }
.track i { height: 6px; background: var(--line); border-radius: 2px; }
.track i.on { background: var(--accent); } .track i.now { background: var(--warn); }
.missing { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 0 0 12px; }
.chdiff > summary { list-style: none; cursor: pointer; }
.appver { margin: 22px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.5; }
.appver b { font-weight: 600; color: var(--ink); }
.chdiff > summary::-webkit-details-marker { display: none; }
.chdiff[open] > summary u { display: none; }
.copy { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; }
.copybox { width: 100%; min-height: 9em; font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn.alt { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.fm { display: grid; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 14px; }
.fm h3 { margin: 0; padding: 0; border: 0; }
.fm .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fm label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.fm input, .fm select { font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
.fmsg { margin: 0; font-size: 13px; font-weight: 600; color: var(--bad); }
.fmsg:empty { display: none; }
.okmsg { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin: 0 0 12px; }
.wait { color: var(--accent); font-size: 12px; font-weight: 600; }
.ent { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.ent .tx { grid-column: 1 / -1; font-size: 14px; overflow-wrap: anywhere; }
.ent .by { font-size: 12px; color: var(--muted); }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
.recipe td { padding: 5px 6px; }
.recipe td.pc { white-space: nowrap; font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.recipe tr.ins td { background: var(--accent-soft); font-weight: 600; font-size: 12px; white-space: pre-line; }
.recipe td.tm { white-space: nowrap; }
.prose { margin: 0 0 8px; white-space: pre-line; overflow-wrap: anywhere; }

.fm textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; min-height: 4.5em; resize: vertical; }
.er { display: grid; grid-template-columns: 58px minmax(0, 1fr) 54px 28px 28px; gap: 4px; align-items: center; margin-bottom: 4px; }
.er.tx { grid-template-columns: 120px minmax(0, 1fr) 54px 28px 28px; }
.er.cr { grid-template-columns: 42px minmax(0, 1fr) 40px 46px 24px 24px; }
.er.cr.tx { grid-template-columns: 86px minmax(0, 1fr) 40px 46px 24px 24px; }
.er .erate { grid-column: 2 / -1; font-size: 11.5px; color: var(--muted); margin: -2px 0 2px; font-variant-numeric: tabular-nums; min-height: 0; }
.er .erate:empty { display: none; }
.er .erate.bad { color: var(--bad, #b3261e); }
.er .ewt { font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.er.m2 { grid-template-columns: minmax(0, 1fr) 70px; }
.er.m2 .erate { grid-column: 1 / -1; }
.er.fn { grid-template-columns: 44px minmax(0, 1fr) 62px 24px 24px; }
.er input, .er textarea { font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px; width: 100%; box-sizing: border-box; min-width: 0; font-family: inherit; }
.er input[data-f="d"] { font-size: 12px; padding: 6px 4px; }
.er input:not([data-f="d"]) { font-size: 15px; padding: 6px 4px; }
.er .wide { grid-column: 1 / -1; min-height: 2.4em; resize: vertical; }
.er .slink { grid-column: 1 / -1; justify-self: end; font-size: 11px; font-weight: 500; min-height: 0; padding: 0; margin-top: -3px; }
.er .x { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; height: 34px; padding: 0; color: var(--muted); }
.eh { display: grid; grid-template-columns: 58px minmax(0, 1fr) 54px 60px; gap: 4px; font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.ebar { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px; margin-top: 12px; }
.ebar .acts { margin: 0; }

main.solo .detail.open { display: block; }
.fm input[type=file] { font-size: 14px; }
.calc { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.coststk { display: grid; gap: 6px; }
.cost-big { font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.steps { font-size: 13px; margin: 0; padding-left: 20px; color: var(--ink); }
.er input.calc { color: var(--muted); }
.fsec { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--accent); margin: 12px 0 4px; padding-top: 6px; border-top: 2px solid var(--line); }
.recipe tr.fstart td { border-top: 2px solid var(--muted); }
.er.dy { grid-template-columns: minmax(0, 1fr) 28px 28px; }
.er.dy .nums { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.er.dy .wide { grid-column: 1 / -1; min-height: 0; }
.er.ln { grid-template-columns: minmax(0, 1fr) 28px; }
.er.ln .nums { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.er.dy, .er.ln { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
.tview th { cursor: pointer; user-select: none; background: var(--surface); position: sticky; top: 0; }
.tview th[aria-sort] { color: var(--accent); }
.tview { background: var(--surface); }
.tview tbody tr { cursor: pointer; }
.tview tbody tr:hover td { background: var(--accent-soft); }
.tview td { white-space: nowrap; }
.tview td.wrap { max-width: 24em; overflow: hidden; text-overflow: ellipsis; }
.hc { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 2px 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; }
.hc:hover { border-color: var(--accent); }
.hc b { font-family: var(--f-display); font-size: 15px; }
.hc .td { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.strow { cursor: pointer; }
.strow:hover td { background: var(--accent-soft); }

@media (min-width: 880px) {
  main { grid-template-columns: minmax(340px, 420px) 1fr; }
  .detail { display: block; }
  .detail.open { position: static; padding-top: 14px; padding-bottom: 24px; }
  .back { display: none; }
  .kv { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  main.solo .detail.open { position: fixed; inset: 0 0 0 auto; width: min(620px, 100%); z-index: 20; box-shadow: 0 0 0 1px var(--line); }

}
</style>

  <header class="top">
    <div class="brand"><h1>SSI Production</h1><div class="src" id="src">Preview · read only</div></div>
    <div class="search"><input id="q" type="search" placeholder="Search lot, customer, product, process, PO, chemical…" autocomplete="off" aria-label="Search"></div>
    <div class="chips" id="chips" role="group" aria-label="Show"></div>
    <datalist id="ed-chems"></datalist>

  <main>
