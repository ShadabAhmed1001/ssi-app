<style>
/* Layout: a one-hand phone tool - search on top, list in the middle, five tabs at the thumb. Wider screens get a list + detail split. */
:root {

  --ok: #6fcf97; --ok-soft: #12301f; --warn: #f0b252; --warn-soft: #36280f;

  --bg: #f3ebdf; --surface: #fffaf3; --ink: #2a1c12; --muted: #77624f; --line: #e2d3bf;

  --ok: #6fcf97; --ok-soft: #12301f; --warn: #f0b252; --warn-soft: #36280f;

html, body { height: 100%; }

.shead, .sitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; color: inherit; }
.shead { padding: 9px 8px; font-weight: 600; font-family: var(--f-display); font-size: 15px; }

.setlist { grid-template-columns: minmax(0, 1fr); }

.pill.ok { background: var(--ok-soft); color: var(--ok); }

  padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.detail.open { display: block; position: fixed; inset: 0; z-index: 20; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

label.chk input { width: 20px; height: 20px; }
.invadd { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; display: grid; gap: 6px; }

  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ---- second look: compact cards (html[data-look="cards"]) ---- */

.brandset { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }

/* ---- polish (v78): sticky page bar, summary card, folding sections, action menus, bottom sheets, toasts ---- */

.tour { position: fixed; inset: 0; z-index: 400; }
.tour-hole { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(10,14,20,.62); outline: 3px solid var(--accent); outline-offset: 2px; transition: all .25s ease; pointer-events: none; }
.tour-hole.none { box-shadow: 0 0 0 9999px rgba(10,14,20,.62); outline: none; width: 0 !important; height: 0 !important; left: 50% !important; top: 40% !important; }
.tour-card { box-sizing: border-box; position: fixed; width: min(360px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; box-shadow: 0 12px 40px rgba(0,0,0,.35); transition: top .25s ease, left .25s ease; }
.tour-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
.tour-card p { margin: 0 0 8px; line-height: 1.45; }
.tour-card ul { margin: 0 0 8px; padding-left: 18px; line-height: 1.45; }
.tour-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.tour-foot .sp { flex: 1; color: var(--muted); font-size: .85rem; }
.tour-skip { background: none; border: 0; color: var(--muted); padding: 8px 4px; text-decoration: underline; }
.tour-dots { display: flex; gap: 4px; margin-bottom: 10px; }
.tour-dots i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.tour-dots i.on { background: var(--accent); }
.bkcard { width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
.bkcard .setlist { margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .tour-hole, .tour-card { transition: none; } }

      else { const i = Number(cj0.dataset.cjoin), old = list[i].sec, to = list[i - 1].sec; list.forEach((x) => { if (x.sec === old) { x.sec = to; x.brk = false; } }); }
      showDetail(); typed.forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; }); d.scrollTop = y; return;
    }
    const fs0 = e.target.closest("[data-fsplit]"), fj0 = e.target.closest("[data-fjoin]");
    if (fs0 || fj0) {
      const d = $("#detail"), y = d.scrollTop, typed = [...d.querySelectorAll("input[id],select[id],textarea[id]")].filter((i) => !i.closest(".er")).map((i) => [i.id, i.value]), list = ed.finishing;
      if (fs0) {
        const i = Number(fs0.dataset.fsplit), old = list[i].sec, id = Math.max(...list.map((x) => x.sec || 0)) + 1;
        list.forEach((x, j) => { if (j >= i && x.sec === old) x.sec = id; }); list[i].brk = true; finNorm();
      } else {
        const i = Number(fj0.dataset.fjoin), old = list[i].sec, to = list[i - 1].sec;
        list.forEach((x) => { if (x.sec === old) { x.sec = to; x.brk = false; if (Number(x.c) > 0 && !x.keep) { x.calc = true; x.hint = x.e || x.hint; x.e = ""; } } });
        finNorm(); finSync(i, "c");
      }
      showDetail(); typed.forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; }); d.scrollTop = y; return;
    }
    const add = e.target.closest("[data-edadd]"), del = e.target.closest("[data-eddel]");
    if (add || del) {
      const row = e.target.closest(".er"), sec = row ? row.dataset.sec : add.dataset.sec, list = ed[sec], d = $("#detail"), y = d.scrollTop;
      const typed = [...d.querySelectorAll("input[id],select[id],textarea[id]")].filter((i) => !i.closest(".er")).map((i) => [i.id, i.value]);
      if (del) { list.splice(Number(row.dataset.i), 1); if (sec === "finishing") finNorm(); }
      else if (sec === "finishing") { const at = row ? Number(row.dataset.i) : -1; list.splice(row ? at + 1 : list.length, 0, row ? { c: "", d: "", e: "", f: "", sec: list[at].sec, calc: true, hint: "" } : { c: "", d: "", e: "", f: "", sec: Math.max(0, ...list.map((x) => x.sec || 0)) + 1 }); }
      else list.splice(row ? Number(row.dataset.i) + 1 : list.length, 0, sec === "crust" ? { c: "", d: "", f: "", sec: row ? list[Number(row.dataset.i)].sec : (list.length ? list[list.length - 1].sec : 1) } : sec === "lines" ? { d: "", q: "", r: "", h: "" } : sec === "dyes" ? { d: "", c: "", m: "", a: "", b: "", r: "" } : sec === "machinery" ? { d: "", e: "", isNew: true } : { c: "", d: "", e: "", f: "" });
      showDetail(); typed.forEach(([id, val]) => { const i = document.getElementById(id); if (i) i.value = val; }); d.scrollTop = y; return;
    }
    if (e.target.closest("[data-copy]")) {
      const text = lotText(data.lotBy[sel[tab]]), out = $("#copyout"), btn = e.target.closest("[data-copy]");
      const box = () => { out.innerHTML = `<textarea class="copybox" id="copybox" readonly aria-label="Lot summary">${esc(text)}</textarea>`; $("#copybox").select(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { btn.textContent = "Copied"; }, box); else box();
      return;
    }
    const g = e.target.closest("[data-go]"); if (!g) return;
    stack.push({ tab, k: sel[tab] });
    sel[g.dataset.go] = g.dataset.k;
    if (g.dataset.go === tab) { render(); showDetail(); } else go(g.dataset.go);
  });
  $("#detail").addEventListener("submit", (e) => { e.preventDefault(); submitter = e.submitter ? e.submitter.id : null; submitEntry(e.target); });
  // short list of matches shown under the field, so the keyboard stays usable (the phone's own list covers it)
  // the browser's own autofill, fed only the best matches so the list stays short
  function acFill(el) {
    const q = el.value.trim().toUpperCase(), box = $("#ed-chems");
    const hit = !q ? [] : data.chemicals.map((c) => c.name).filter((n) => n.toUpperCase().includes(q)).sort((a, b) => (b.toUpperCase().startsWith(q) - a.toUpperCase().startsWith(q)) || a.length - b.length).slice(0, 8);
    box.innerHTML = hit.map((n) => `<option value="${esc(n)}">`).join("");
  }
  $("#detail").addEventListener("focusin", (e) => { if (e.target.dataset && e.target.dataset.ac) acFill(e.target); });
  $("#detail").addEventListener("input", (e) => {
    if (e.target.dataset && e.target.dataset.ac) acFill(e.target);
    if (e.target.id === "fo-page") { const f = $("#fm-process"), l = data.lotBy[f.dataset.lot]; $("#fo-src").innerHTML = procSrcOpts(e.target.value, l.lot_no); $("#fo-hint").textContent = procHint(l, e.target.value); return; }
    if (e.target.id === "cmp-page") { const p = e.target.value; $("#cmp-b").innerHTML = pageRecipes(p).map((x) => recOpt(x)).join(""); }
    if (["cmp-a", "cmp-b", "cmp-page"].includes(e.target.id)) { $("#cmp-out").innerHTML = cmpHtml($("#cmp-a").value, $("#cmp-b").value); return; }
    const ci = e.target.closest("[data-cost]");
    if (ci) { const k = sel[tab], key = ci.closest("[data-costkey]").dataset.costkey; costIn[key] = costIn[key] || {}; costIn[key][ci.dataset.cost] = ci.value; const b = $("#costbox"), r = getRecipe(k); if (b && r) b.innerHTML = costBox(r); return; }
    const f = e.target.closest("form"); if (!f) return;
    delete f.dataset.warned; $("#fm-msg").textContent = "";
    if (f.id === "fm-invoice") { invInput(e.target); return; }
    const t = e.target, row = t.closest(".er");
    if (f.id === "fm-recipe" && /^e-c-\d+-c$/.test(t.id)) { const w = $("#ewt-" + t.id.split("-")[2]); if (w) w.textContent = crustWt(t.value); }
    if (f.id === "fm-recipe" && (/^e-[cfm]-\d+-[cde]$/.test(t.id) || /^eh-(animal|pcs)$/.test(t.id))) setTimeout(edRatesRefresh, 0);
    if (f.id === "fm-count") { countCalc(f); return; }
    if (e.target.id === "fv-to") { $("#fv-newl").style.display = e.target.value ? "none" : ""; return; }
    if (e.target.dataset.pinfo) { $("#" + e.target.dataset.pinfo).textContent = purchInfo(e.target.value); return; }
    if (f.id === "fm-page") {
      const h = $("#fg-hint"), to = $("#fg-page").value, l = data.lotBy[f.dataset.lot]; if (!h) return;
      h.textContent = !to ? "" : data.recipes["rec:" + l.lot_no + "|" + to] ? "This lot already has a recipe on that page, so nothing is copied." : !newLayout(to) ? "That page has an older layout, so the recipe can't be copied. Enter it in Excel." : "";
      return;
    }
    if (!["fm-recipe", "fm-order", "fm-dye"].includes(f.id)) {
      if (t.dataset.fillpo !== undefined && t.value) { const o = data.orders.find((x) => String(x.id) === t.value); if (o) { const set = (id, val) => { if (!$(id).value && val) $(id).value = val; }; set("#fn-cust", o.customer); set("#fn-prod", o.item); set("#fn-qty", o.qty_sqft); set("#fn-odt", String(o.po_date || "").slice(0, 10)); } }
      return;
    }
    if (t.dataset.h) ed.head[t.dataset.h] = t.value;
    else if (row) { ed[row.dataset.sec][Number(row.dataset.i)][t.dataset.f] = t.value; if (row.dataset.sec === "finishing" && ["e", "c"].includes(t.dataset.f)) finSync(Number(row.dataset.i), t.dataset.f); }
    if (ed && formOpen === "recipe" && (t.dataset.h || row)) { draftSoon(); edMarkChanges(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#detail").classList.contains("open") && window.innerWidth < 880) closeDetail(); });

  boot().catch((err) => {
    $("#list").innerHTML = `<div class="loader"><div>The data could not be opened (${esc(err.message || err)}).</div></div>`;
  });
})();
</script>
